<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>RXTRO Walls — Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- RXTRO configuration -->
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070707;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      border-bottom: 1px solid #222;
      background: #090909;
    }

    .header {
      max-width: 1100px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
    }

    .logo span {
      color: #777;
      font-weight: 400;
    }

    #logoutButton {
      display: none;
      background: #151515;
      border: 1px solid #333;
      color: #fff;
      border-radius: 9px;
      padding: 10px 15px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .login,
    .dashboard {
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 30px;
    }

    .login {
      max-width: 450px;
      margin: 60px auto;
    }

    .dashboard {
      display: none;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 23px;
      margin: 40px 0 18px;
    }

    .subtitle {
      color: #888;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
      border-radius: 9px;
      padding: 13px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      background: #fff;
      color: #000;
      border: 0;
      padding: 14px;
      border-radius: 9px;
      font-weight: 900;
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      background: #171717;
      border: 1px solid #292929;
      color: #aaa;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: #9cffb0;
      border-color: #24482d;
    }

    .error {
      color: #ff9b9b;
      border-color: #512626;
    }

    .preview {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      background: #050505;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .checkbox input {
      width: auto;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .stat {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
    }

    .stat small {
      display: block;
      color: #777;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 26px;
    }

    .wall-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .wall {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 13px;
      overflow: hidden;
    }

    .wall img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    .wall-info {
      padding: 12px;
    }

    .wall-info strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wall-info small {
      display: block;
      color: #777;
      margin-top: 5px;
    }

    .delete {
      width: 100%;
      margin-top: 10px;
      background: #281010;
      color: #ff9999;
      border: 1px solid #4a2020;
      padding: 9px;
      border-radius: 8px;
    }

    .progress {
      display: none;
      width: 100%;
      height: 6px;
      background: #222;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width .2s;
    }

    @media (max-width: 800px) {
      .wall-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 20px 15px 50px;
      }

      .login,
      .dashboard {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .wall-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      RXTRO <span>WALLS</span>
    </div>

    <button id="logoutButton">
      Logout
    </button>

  </div>
</header>


<main>

  <!-- LOGIN -->

  <section id="loginBox" class="login">

    <h1>
      Owner Login
    </h1>

    <p class="subtitle">
      Sign in to manage your RXTRO Walls wallpapers.
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Your Gmail"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Your password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        class="primary"
        type="submit"
      >
        Login
      </button>

    </form>

    <div id="loginStatus" class="status">
      Checking configuration...
    </div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="dashboard">

    <h1>
      RXTRO Walls Dashboard
    </h1>

    <p class="subtitle">
      Upload and manage your wallpapers.
    </p>


    <div class="stats">

      <div class="stat">
        <small>Wallpapers</small>
        <strong id="totalWallpapers">0</strong>
      </div>

      <div class="stat">
        <small>Downloads</small>
        <strong id="totalDownloads">0</strong>
      </div>

      <div class="stat">
        <small>Views</small>
        <strong id="totalViews">0</strong>
      </div>

    </div>


    <h2>
      Upload Wallpaper
    </h2>


    <form id="uploadForm">

      <label for="image">
        Wallpaper Image
      </label>

      <input
        id="image"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        required
      >

      <img
        id="preview"
        class="preview"
        alt="Wallpaper preview"
      >


      <label for="title">
        Title
      </label>

      <input
        id="title"
        type="text"
        placeholder="BMW M4 Night"
        maxlength="100"
        required
      >


      <label for="category">
        Category
      </label>

      <select id="category">

        <option value="Cars">Cars</option>
        <option value="Football">Football</option>
        <option value="Basketball">Basketball</option>
        <option value="Gaming">Gaming</option>
        <option value="Aesthetic">Aesthetic</option>
        <option value="Dark">Dark</option>
        <option value="AI">AI</option>

      </select>


      <label for="device">
        Device
      </label>

      <select id="device">

        <option value="iPhone">iPhone</option>
        <option value="Android">Android</option>
        <option value="Desktop">Desktop</option>

      </select>


      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Describe this wallpaper..."
        maxlength="500"
      ></textarea>


      <label class="checkbox">

        <input
          id="premium"
          type="checkbox"
        >

        Premium wallpaper

      </label>


      <button
        id="publishButton"
        class="primary"
        type="submit"
      >
        Publish Wallpaper
      </button>


      <div id="progress" class="progress">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </form>


    <div id="uploadStatus" class="status">
      Ready.
    </div>


    <h2>
      Your Wallpapers
    </h2>


    <div
      id="wallList"
      class="wall-list"
    ></div>

  </section>

</main>


<script>

  let client = null;


  const loginBox =
    document.getElementById("loginBox");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginStatus =
    document.getElementById("loginStatus");

  const logoutButton =
    document.getElementById("logoutButton");


  /*
   * CONFIGURATION
   */

  function initializeSupabase() {

    try {

      if (
        typeof supabase === "undefined"
      ) {
        throw new Error(
          "Supabase library did not load."
        );
      }


      if (
        !window.RXTRO_CONFIG
      ) {
        throw new Error(
          "config.js was not loaded. Make sure config.js is in the root of the GitHub repository."
        );
      }


      const url =
        window.RXTRO_CONFIG.SUPABASE_URL;

      const key =
        window.RXTRO_CONFIG.SUPABASE_KEY;


      if (!url || !key) {
        throw new Error(
          "SUPABASE_URL or SUPABASE_KEY is missing from config.js."
        );
      }


      client =
        supabase.createClient(
          url,
          key
        );


      loginStatus.textContent =
        "Supabase connected. Enter your login.";

      loginStatus.className =
        "status";


      checkSession();


    } catch (error) {

      console.error(
        "CONFIG ERROR:",
        error
      );


      loginStatus.textContent =
        "Configuration error: "
        + error.message;

      loginStatus.className =
        "status error";

      loginButton.disabled =
        true;

    }

  }


  /*
   * LOGIN
   */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!client) {

        loginStatus.textContent =
          "Supabase is not connected.";

        loginStatus.className =
          "status error";

        return;

      }


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      loginStatus.textContent =
        "Signing in...";

      loginStatus.className =
        "status";


      loginButton.disabled =
        true;

      loginButton.textContent =
        "Signing in...";


      try {

        const {
          data,
          error
        } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (
          !data ||
          !data.session
        ) {
          throw new Error(
            "No login session was returned."
          );
        }


        loginStatus.textContent =
          "✓ Login successful.";

        loginStatus.className =
          "status success";


        showDashboard();


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        loginStatus.textContent =
          "Login error: "
          + (
            error.message ||
            "Unknown error."
          );

        loginStatus.className =
          "status error";


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

      }

    }
  );


  /*
   * CHECK SESSION
   */

  async function checkSession() {

    if (!client) {
      return;
    }


    try {

      const {
        data,
        error
      } =
        await client.auth.getSession();


      if (error) {
        console.error(error);
        return;
      }


      if (
        data &&
        data.session
      ) {

        showDashboard();

      }

    } catch (error) {

      console.error(error);

    }

  }


  /*
   * SHOW DASHBOARD
   */

  function showDashboard() {

    loginBox.style.display =
      "none";

    dashboard.style.display =
      "block";

    logoutButton.style.display =
      "block";


    loadWallpapers();

  }


  /*
   * LOGOUT
   */

  logoutButton.addEventListener(
    "click",
    async function() {

      try {

        if (client) {
          await client.auth.signOut();
        }

      } catch (error) {

        console.error(error);

      }


      dashboard.style.display =
        "none";

      loginBox.style.display =
        "block";

      logoutButton.style.display =
        "none";

      loginStatus.textContent =
        "Logged out.";

      loginStatus.className =
        "status";

    }
  );


  /*
   * IMAGE PREVIEW
   */

  document
    .getElementById("image")
    .addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];

        const preview =
          document.getElementById(
            "preview"
          );


        if (!file) {

          preview.style.display =
            "none";

          return;

        }


        const allowed = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];


        if (
          !allowed.includes(file.type)
        ) {

          alert(
            "Please select JPG, PNG or WEBP."
          );

          event.target.value =
            "";

          preview.style.display =
            "none";

          return;

        }


        if (
          file.size >
          10 * 1024 * 1024
        ) {

          alert(
            "Maximum file size is 10 MB."
          );

          event.target.value =
            "";

          preview.style.display =
            "none";

          return;

        }


        preview.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

      }
    );


  /*
   * UPLOAD
   */

  document
    .getElementById("uploadForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const uploadStatus =
          document.getElementById(
            "uploadStatus"
          );

        const publishButton =
          document.getElementById(
            "publishButton"
          );

        const progress =
          document.getElementById(
            "progress"
          );

        const progressBar =
          document.getElementById(
            "progressBar"
          );


        try {

          uploadStatus.textContent =
            "Checking login...";

          uploadStatus.className =
            "status";


          const {
            data: sessionData
          } =
            await client.auth.getSession();


          if (
            !sessionData ||
            !sessionData.session
          ) {

            throw new Error(
              "You are not logged in."
            );

          }


          const file =
            document
              .getElementById("image")
              .files[0];


          const title =
            document
              .getElementById("title")
              .value
              .trim();


          const category =
            document
              .getElementById("category")
              .value;


          const device =
            document
              .getElementById("device")
              .value;


          const description =
            document
              .getElementById("description")
              .value
              .trim();


          const premium =
            document
              .getElementById("premium")
              .checked;


          if (!file) {
            throw new Error(
              "Please select an image."
            );
          }


          if (!title) {
            throw new Error(
              "Please enter a title."
            );
          }


          publishButton.disabled =
            true;

          publishButton.textContent =
            "Uploading...";


          progress.style.display =
            "block";

          progressBar.style.width =
            "10%";


          uploadStatus.textContent =
            "Uploading image...";


          /*
           * UNIQUE FILE NAME
           */

          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase();


          const uniqueName =
            crypto.randomUUID()
            + "."
            + extension;


          const storagePath =
            "wallpapers/"
            + uniqueName;


          /*
           * STORAGE
           */

          const {
            error: storageError
          } =
            await client
              .storage
              .from("wallpapers")
              .upload(
                storagePath,
                file,
                {
                  contentType:
                    file.type,
                  cacheControl:
                    "3600",
                  upsert:
                    false
                }
              );


          if (storageError) {

            throw new Error(
              "Storage error: "
              + storageError.message
            );

          }


          progressBar.style.width =
            "55%";


          uploadStatus.textContent =
            "Image uploaded. Saving wallpaper...";


          /*
           * PUBLIC URL
           */

          const {
            data: publicData
          } =
            client
              .storage
              .from("wallpapers")
              .getPublicUrl(
                storagePath
              );


          const imageUrl =
            publicData &&
            publicData.publicUrl;


          if (!imageUrl) {

            throw new Error(
              "Could not generate image URL."
            );

          }


          /*
           * DATABASE
           */

          const {
            error: databaseError
          } =
            await client
              .from("wallpapers")
              .insert({

                title:
                  title,

                category:
                  category,

                device:
                  device,

                description:
                  description,

                image_url:
                  imageUrl,

                storage_path:
                  storagePath,

                is_premium:
                  premium,

                downloads:
                  0,

                views:
                  0

              });


          if (databaseError) {

            await client
              .storage
              .from("wallpapers")
              .remove([
                storagePath
              ]);


            throw new Error(
              "Database error: "
              + databaseError.message
            );

          }


          progressBar.style.width =
            "100%";


          uploadStatus.textContent =
            "✓ Wallpaper published successfully!";

          uploadStatus.className =
            "status success";


          document
            .getElementById("uploadForm")
            .reset();


          document
            .getElementById("preview")
            .style.display =
            "none";


          await loadWallpapers();


        } catch (error) {

          console.error(
            "UPLOAD ERROR:",
            error
          );


          uploadStatus.textContent =
            "Upload error: "
            + (
              error.message ||
              "Unknown error."
            );

          uploadStatus.className =
            "status error";


        } finally {

          publishButton.disabled =
            false;

          publishButton.textContent =
            "Publish Wallpaper";


          setTimeout(
            function() {

              progress.style.display =
                "none";

              progressBar.style.width =
                "0%";

            },
            1000
          );

        }

      }
    );


  /*
   * LOAD WALLPAPERS
   */

  async function loadWallpapers() {

    const list =
      document.getElementById(
        "wallList"
      );


    list.innerHTML =
      "<p style='color:#777'>Loading wallpapers...</p>";


    try {

      const {
        data,
        error
      } =
        await client
          .from("wallpapers")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {
        throw error;
      }


      list.innerHTML =
        "";


      let totalDownloads =
        0;

      let totalViews =
        0;


      (data || []).forEach(
        wallpaper => {

          totalDownloads +=
            Number(
              wallpaper.downloads || 0
            );

          totalViews +=
            Number(
              wallpaper.views || 0
            );


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "wall";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            wallpaper.image_url;

          image.alt =
            wallpaper.title ||
            "Wallpaper";

          image.loading =
            "lazy";


          const info =
            document.createElement(
              "div"
            );


          info.className =
            "wall-info";


          const title =
            document.createElement(
              "strong"
            );


          title.textContent =
            wallpaper.title ||
            "Untitled";


          const meta =
            document.createElement(
              "small"
            );


          meta.textContent =
            (
              wallpaper.category ||
              "Wallpaper"
            )
            +
            " · "
            +
            (
              wallpaper.device ||
              "All"
            );


          const downloads =
            document.createElement(
              "small"
            );


          downloads.textContent =
            Number(
              wallpaper.downloads || 0
            )
            +
            " downloads";


          const views =
            document.createElement(
              "small"
            );


          views.textContent =
            Number(
              wallpaper.views || 0
            )
            +
            " views";


          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete";

          deleteButton.textContent =
            "Delete";


          deleteButton.addEventListener(
            "click",
            function() {

              deleteWallpaper(
                wallpaper
              );

            }
          );


          info.appendChild(title);
          info.appendChild(meta);
          info.appendChild(downloads);
          info.appendChild(views);
          info.appendChild(deleteButton);


          card.appendChild(image);
          card.appendChild(info);


          list.appendChild(card);

        }
      );


      if (
        !data ||
        data.length === 0
      ) {

        list.innerHTML =
          "<p style='color:#777'>No wallpapers yet.</p>";

      }


      document
        .getElementById(
          "totalWallpapers"
        )
        .textContent =
        data
          ? data.length
          : 0;


      document
        .getElementById(
          "totalDownloads"
        )
        .textContent =
        totalDownloads;


      document
        .getElementById(
          "totalViews"
        )
        .textContent =
        totalViews;


    } catch (error) {

      console.error(
        "LOAD ERROR:",
        error
      );


      list.innerHTML =
        `
          <p class="error">
            Could not load wallpapers:
            ${escapeHtml(error.message)}
          </p>
        `;

    }

  }


  /*
   * DELETE WALLPAPER
   */

  async function deleteWallpaper(
    wallpaper
  ) {

    const confirmed =
      confirm(
        "Delete this wallpaper permanently?"
      );


    if (!confirmed) {
      return;
    }


    try {

      const {
        error: databaseError
      } =
        await client
          .from("wallpapers")
          .delete()
          .eq(
            "id",
            wallpaper.id
          );


      if (databaseError) {
        throw databaseError;
      }


      if (
        wallpaper.storage_path
      ) {

        const {
          error: storageError
        } =
          await client
            .storage
            .from("wallpapers")
            .remove([
              wallpaper.storage_path
            ]);


        if (storageError) {

          console.warn(
            "Storage delete warning:",
            storageError
          );

        }

      }


      await loadWallpapers();


    } catch (error) {

      alert(
        "Delete error: "
        + error.message
      );

    }

  }


  /*
   * ESCAPE HTML
   */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,
      function(character) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[character];

      }
    );

  }


  /*
   * START
   */

  initializeSupabase();

</script>
