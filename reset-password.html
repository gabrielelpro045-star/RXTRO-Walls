<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>RXTRO Walls — Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070707;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 35px;
    }

    .logo span {
      color: #777;
      font-weight: 400;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 10px;
    }

    .description {
      color: #888;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 14px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      background: #171717;
      border: 1px solid #292929;
      color: #aaa;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: #9cffb0;
      border-color: #24482d;
    }

    .error {
      color: #ff9b9b;
      border-color: #512626;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      RXTRO <span>WALLS</span>
    </div>

    <h1>
      Create new password
    </h1>

    <p class="description">
      Enter a new password for your RXTRO Walls owner account.
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        id="password"
        type="password"
        placeholder="New password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm new password
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Repeat password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button
        id="resetButton"
        type="submit"
      >
        Update Password
      </button>

    </form>

    <div
      id="status"
      class="status"
    >
      Checking reset link...
    </div>

    <a
      class="back"
      href="./admin.html"
    >
      ← Back to Owner Login
    </a>

  </div>


<script>

  let client = null;


  const status =
    document.getElementById("status");

  const form =
    document.getElementById("resetForm");

  const button =
    document.getElementById("resetButton");


  /*
   * INITIALIZE SUPABASE
   */

  function initialize() {

    try {

      if (
        typeof supabase === "undefined"
      ) {
        throw new Error(
          "Supabase library failed to load."
        );
      }


      if (
        !window.RXTRO_CONFIG
      ) {
        throw new Error(
          "config.js was not loaded."
        );
      }


      const url =
        window.RXTRO_CONFIG.SUPABASE_URL;

      const key =
        window.RXTRO_CONFIG.SUPABASE_KEY;


      if (!url || !key) {
        throw new Error(
          "Supabase configuration is missing."
        );
      }


      client =
        supabase.createClient(
          url,
          key
        );


      checkSession();


    } catch (error) {

      console.error(error);

      showError(
        "Configuration error: "
        + error.message
      );

    }

  }


  /*
   * CHECK RESET SESSION
   */

  async function checkSession() {

    try {

      const {
        data,
        error
      } =
        await client.auth.getSession();


      if (error) {
        throw error;
      }


      if (
        data &&
        data.session
      ) {

        status.textContent =
          "✓ Reset link verified. Enter your new password.";

        status.className =
          "status success";

        return;

      }


      /*
       * Listen for the recovery event.
       */

      client.auth.onAuthStateChange(
        function(event, session) {

          if (
            event === "PASSWORD_RECOVERY" &&
            session
          ) {

            status.textContent =
              "✓ Reset link verified. Enter your new password.";

            status.className =
              "status success";

          }

        }
      );


      /*
       * Supabase may process the token
       * shortly after page load.
       */

      setTimeout(
        async function() {

          const {
            data: current
          } =
            await client.auth.getSession();


          if (
            current &&
            current.session
          ) {

            status.textContent =
              "✓ Reset link verified. Enter your new password.";

            status.className =
              "status success";

          } else {

            showError(
              "This password reset link is invalid or expired. Request a new one."
            );

          }

        },
        1200
      );


    } catch (error) {

      console.error(error);

      showError(
        "Reset link error: "
        + error.message
      );

    }

  }


  /*
   * UPDATE PASSWORD
   */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const password =
        document
          .getElementById("password")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (
        password.length < 6
      ) {

        showError(
          "Password must contain at least 6 characters."
        );

        return;

      }


      if (
        password !== confirmPassword
      ) {

        showError(
          "Passwords do not match."
        );

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "Updating...";


      status.textContent =
        "Updating your password...";

      status.className =
        "status";


      try {

        const {
          data,
          error
        } =
          await client.auth.updateUser({
            password:
              password
          });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {
          throw new Error(
            "Password could not be updated."
          );
        }


        status.textContent =
          "✓ Password updated successfully! You can now log in.";

        status.className =
          "status success";


        form.reset();


        button.textContent =
          "Password Updated";


        setTimeout(
          function() {

            window.location.href =
              "./admin.html";

          },
          1800
        );


      } catch (error) {

        console.error(
          "PASSWORD UPDATE ERROR:",
          error
        );


        showError(
          "Password update error: "
          + error.message
        );


        button.disabled =
          false;

        button.textContent =
          "Update Password";

      }

    }
  );


  /*
   * ERROR
   */

  function showError(
    message
  ) {

    status.textContent =
      message;

    status.className =
      "status error";

  }


  /*
   * START
   */

  initialize();

</script>

</body>
</html>
