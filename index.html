<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#070707">
  <meta name="description" content="RXTRO Walls — Premium wallpapers for iPhone, Android and desktop.">

  <title>RXTRO Walls</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #070707;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 7, 7, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #1d1d1d;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /*
      OWNER ACCESS

      Tap the logo 5 times quickly.
    */

    .logo {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.5px;
      user-select: none;
      -webkit-user-select: none;
    }

    .logo span {
      color: #777;
      font-weight: 400;
    }

    /* SEARCH */

    .search {
      width: 100%;
      max-width: 390px;
    }

    .search input {
      width: 100%;
      background: #111;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 10px;
      padding: 12px 15px;
      outline: none;
    }

    .search input:focus {
      border-color: #555;
    }

    /* HERO */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 80px 20px 50px;
    }

    .hero h1 {
      font-size: clamp(44px, 8vw, 82px);
      line-height: .95;
      letter-spacing: -4px;
      max-width: 850px;
    }

    .hero h1 span {
      color: #777;
    }

    .hero p {
      color: #888;
      font-size: 17px;
      line-height: 1.6;
      margin-top: 25px;
      max-width: 600px;
    }

    /* CONTROLS */

    .controls {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter {
      background: #111;
      color: #aaa;
      border: 1px solid #292929;
      border-radius: 9px;
      padding: 10px 15px;
      transition: .2s;
    }

    .filter:hover,
    .filter.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* WALLPAPER GRID */

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .section-heading h2 {
      font-size: 25px;
    }

    .section-heading span {
      color: #666;
      font-size: 13px;
    }

    .wallpapers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .wallpaper {
      position: relative;
      overflow: hidden;
      background: #111;
      border: 1px solid #242424;
      border-radius: 15px;
      min-height: 250px;
    }

    .wallpaper-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .wallpaper:hover .wallpaper-image {
      transform: scale(1.035);
    }

    .wallpaper-info {
      padding: 13px;
      background: #101010;
    }

    .wallpaper-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wallpaper-meta {
      color: #666;
      font-size: 12px;
      margin-top: 6px;
    }

    .download-button {
      width: 100%;
      margin-top: 11px;
      background: #fff;
      color: #000;
      border: 0;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
    }

    .download-button:hover {
      opacity: .88;
    }

    .premium {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .75);
      border: 1px solid rgba(255, 255, 255, .2);
      color: #fff;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    /* STATES */

    .message {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      grid-column: 1 / -1;
    }

    .message strong {
      display: block;
      color: #aaa;
      font-size: 18px;
      margin-bottom: 8px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #1d1d1d;
      margin-top: 80px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #555;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 950px) {
      .wallpapers {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {

      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        align-self: flex-start;
      }

      .search {
        max-width: none;
      }

      .hero {
        padding-top: 55px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .wallpapers {
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
      }

      .wallpaper {
        border-radius: 11px;
      }

      .footer-inner {
        flex-direction: column;
      }

    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <header>

    <div class="header-inner">

      <button
        id="logoButton"
        class="logo"
        type="button"
        aria-label="RXTRO Walls"
      >
        RXTRO <span>WALLS</span>
      </button>


      <div class="search">

        <input
          id="searchInput"
          type="search"
          placeholder="Search wallpapers..."
          autocomplete="off"
        >

      </div>

    </div>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Your screen.
      <br>
      <span>Your style.</span>
    </h1>

    <p>
      Discover premium wallpapers for iPhone,
      Android and desktop.
    </p>

  </section>


  <!-- FILTERS -->

  <div class="controls">

    <button
      class="filter active"
      data-category="All"
    >
      All
    </button>

    <button
      class="filter"
      data-category="Cars"
    >
      Cars
    </button>

    <button
      class="filter"
      data-category="Football"
    >
      Football
    </button>

    <button
      class="filter"
      data-category="Basketball"
    >
      Basketball
    </button>

    <button
      class="filter"
      data-category="Gaming"
    >
      Gaming
    </button>

    <button
      class="filter"
      data-category="Aesthetic"
    >
      Aesthetic
    </button>

    <button
      class="filter"
      data-category="Dark"
    >
      Dark
    </button>

    <button
      class="filter"
      data-category="AI"
    >
      AI
    </button>

  </div>


  <!-- WALLPAPERS -->

  <section class="section">

    <div class="section-heading">

      <h2>
        Trending Wallpapers
      </h2>

      <span id="wallpaperCount">
        Loading...
      </span>

    </div>


    <div
      id="wallpapers"
      class="wallpapers"
    >

      <div class="message">

        <strong>
          Loading wallpapers...
        </strong>

        Please wait.

      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-inner">

      <div>
        © 2026 RXTRO Walls
      </div>

      <div>
        Your screen. Your style.
      </div>

    </div>

  </footer>


<script>

  /*
   * SUPABASE
   */

  let client = null;

  let allWallpapers = [];

  let activeCategory = "All";

  let searchTerm = "";


  /*
   * ELEMENTS
   */

  const wallpapersContainer =
    document.getElementById(
      "wallpapers"
    );

  const wallpaperCount =
    document.getElementById(
      "wallpaperCount"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  /*
   * INITIALIZE
   */

  function initializeSupabase() {

    try {

      if (
        typeof supabase === "undefined"
      ) {

        throw new Error(
          "Supabase library failed to load."
        );

      }


      if (
        typeof SUPABASE_URL === "undefined" ||
        typeof SUPABASE_KEY === "undefined"
      ) {

        throw new Error(
          "config.js is missing."
        );

      }


      client =
        supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      loadWallpapers();


    } catch (error) {

      console.error(
        error
      );


      showMessage(
        "Unable to load wallpapers",
        "Please try again later."
      );

    }

  }


  /*
   * LOAD WALLPAPERS
   */

  async function loadWallpapers() {

    if (!client) {
      return;
    }


    try {

      const {
        data,
        error
      } =
        await client
          .from("wallpapers")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        throw error;

      }


      allWallpapers =
        data || [];


      renderWallpapers();


    } catch (error) {

      console.error(
        "WALLPAPER ERROR:",
        error
      );


      showMessage(
        "Unable to load wallpapers",
        error.message
      );

    }

  }


  /*
   * RENDER
   */

  function renderWallpapers() {

    let results =
      [...allWallpapers];


    /*
     * CATEGORY
     */

    if (
      activeCategory !== "All"
    ) {

      results =
        results.filter(
          wallpaper =>
            String(
              wallpaper.category || ""
            ).toLowerCase()
            ===
            activeCategory.toLowerCase()
        );

    }


    /*
     * SEARCH
     */

    if (searchTerm) {

      results =
        results.filter(
          wallpaper => {

            const title =
              String(
                wallpaper.title || ""
              ).toLowerCase();

            const category =
              String(
                wallpaper.category || ""
              ).toLowerCase();

            return (
              title.includes(
                searchTerm
              )
              ||
              category.includes(
                searchTerm
              )
            );

          }
        );

    }


    wallpaperCount.textContent =
      results.length
      +
      (
        results.length === 1
          ? " wallpaper"
          : " wallpapers"
      );


    wallpapersContainer.innerHTML =
      "";


    if (
      results.length === 0
    ) {

      showMessage(
        "No wallpapers found",
        "Try another search or category."
      );

      return;

    }


    results.forEach(
      wallpaper => {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "wallpaper";


        /*
         * PREMIUM
         */

        if (
          wallpaper.is_premium
        ) {

          const badge =
            document.createElement(
              "div"
            );


          badge.className =
            "premium";


          badge.textContent =
            "PREMIUM";


          card.appendChild(
            badge
          );

        }


        /*
         * IMAGE
         */

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "wallpaper-image";


        image.src =
          wallpaper.image_url;


        image.alt =
          wallpaper.title ||
          "RXTRO Wallpaper";


        image.loading =
          "lazy";


        card.appendChild(
          image
        );


        /*
         * INFO
         */

        const info =
          document.createElement(
            "div"
          );


        info.className =
          "wallpaper-info";


        const title =
          document.createElement(
            "div"
          );


        title.className =
          "wallpaper-title";


        title.textContent =
          wallpaper.title ||
          "Untitled Wallpaper";


        info.appendChild(
          title
        );


        const meta =
          document.createElement(
            "div"
          );


        meta.className =
          "wallpaper-meta";


        meta.textContent =
          (
            wallpaper.category ||
            "Wallpaper"
          )
          +
          " · "
          +
          (
            wallpaper.device ||
            "All devices"
          );


        info.appendChild(
          meta
        );


        /*
         * DOWNLOAD
         */

        const download =
          document.createElement(
            "button"
          );


        download.className =
          "download-button";


        download.textContent =
          "Download";


        download.addEventListener(
          "click",
          function() {

            downloadWallpaper(
              wallpaper
            );

          }
        );


        info.appendChild(
          download
        );


        card.appendChild(
          info
        );


        wallpapersContainer.appendChild(
          card
        );

      }
    );

  }


  /*
   * DOWNLOAD
   */

  async function downloadWallpaper(
    wallpaper
  ) {

    try {

      /*
       * Count download
       */

      try {

        await client
          .from("wallpapers")
          .update({
            downloads:
              Number(
                wallpaper.downloads || 0
              ) + 1
          })
          .eq(
            "id",
            wallpaper.id
          );

      } catch (error) {

        console.warn(
          "Download count failed:",
          error
        );

      }


      /*
       * Open image
       */

      const link =
        document.createElement(
          "a"
        );


      link.href =
        wallpaper.image_url;


      link.target =
        "_blank";


      link.rel =
        "noopener";


      link.download =
        "";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Unable to download wallpaper."
      );

    }

  }


  /*
   * SEARCH
   */

  searchInput.addEventListener(
    "input",
    function() {

      searchTerm =
        this.value
          .trim()
          .toLowerCase();


      renderWallpapers();

    }
  );


  /*
   * CATEGORY FILTERS
   */

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".filter"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            this.classList.add(
              "active"
            );


            activeCategory =
              this.dataset.category;


            renderWallpapers();

          }
        );

      }
    );


  /*
   * HIDDEN OWNER ACCESS
   *
   * Tap logo 5 times within 2 seconds.
   */

  let logoTaps = 0;

  let logoTimer = null;


  document
    .getElementById(
      "logoButton"
    )
    .addEventListener(
      "click",
      function() {

        logoTaps++;


        clearTimeout(
          logoTimer
        );


        logoTimer =
          setTimeout(
            function() {

              logoTaps = 0;

            },
            2000
          );


        if (
          logoTaps >= 5
        ) {

          logoTaps = 0;


          clearTimeout(
            logoTimer
          );


          const ownerAccess =
            confirm(
              "Owner access — open RXTRO Walls Admin?"
            );


          if (
            ownerAccess
          ) {

            window.location.href =
              "admin.html";

          }

        }

      }
    );


  /*
   * MESSAGE
   */

  function showMessage(
    title,
    text
  ) {

    wallpapersContainer.innerHTML = `

      <div class="message">

        <strong>
          ${escapeHtml(title)}
        </strong>

        ${escapeHtml(text)}

      </div>

    `;


    wallpaperCount.textContent =
      "";

  }


  /*
   * SECURITY
   */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    ).replace(
      /[&<>"']/g,
      function(character) {

        return {

          "&": "&amp;",

          "<": "&lt;",

          ">": "&gt;",

          '"': "&quot;",

          "'": "&#039;"

        }[character];

      }
    );

  }


  /*
   * START
   */

  initializeSupabase();

</script>

</body>
</html>
